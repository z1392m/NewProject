name: Android NDK library build

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/jni/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Verify native project
        run: |
          test -f app/src/main/jni/Android.mk
          test -f app/src/main/jni/Application.mk
      - name: Install Android NDK r24
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/android-ndk-r24-linux.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r24-linux.zip -o "$ARCHIVE"
          echo "eceb18f147282eb93615eff1ad84a9d3962fbb31  $ARCHIVE" | sha1sum -c -
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP"
          echo "NDK_HOME=$RUNNER_TEMP/android-ndk-r24" >> "$GITHUB_ENV"
      - name: Build native shared libraries
        shell: bash
        run: |
          set -euo pipefail
          JNI="$GITHUB_WORKSPACE/app/src/main/jni"
          "$NDK_HOME/ndk-build" \
            NDK_PROJECT_PATH=null \
            APP_BUILD_SCRIPT="$JNI/Android.mk" \
            NDK_APPLICATION_MK="$JNI/Application.mk" \
            APP_ABI=arm64-v8a APP_PLATFORM=android-26 APP_OPTIM=release \
            NDK_OUT="$GITHUB_WORKSPACE/obj" \
            NDK_LIBS_OUT="$GITHUB_WORKSPACE/libs" \
            -j"$(nproc)"
      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v6
        with:
          name: YadavXModer-ARM64
          path: libs/arm64-v8a/libYadavXModer.so
          if-no-files-found: error
